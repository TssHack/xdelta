<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- GNOME Adwaita Blue Gradients -->
    <linearGradient id="gnome_left_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="40%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <linearGradient id="gnome_right_wing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#99c1f1"/>
      <stop offset="50%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>

    <linearGradient id="gnome_base_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="50%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#62a0ea"/>
    </linearGradient>

    <!-- Rust Engine Energy Core -->
    <linearGradient id="gnome_rust_core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7800"/>
      <stop offset="100%" stop-color="#e66100"/>
    </linearGradient>

    <!-- 1px Specular Top Highlight -->
    <linearGradient id="gnome_rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- GNOME Ambient Drop Shadow -->
    <filter id="gnome_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#gnome_shadow)">
    <!-- Primary Left-To-Right Diagonal Beam -->
    <path d="M 154 116 
             C 164 104 182 100 196 108
             L 392 396
             C 402 408 398 424 384 432
             L 352 446
             C 338 454 320 448 310 436
             L 112 152
             C 102 140 106 124 120 116 Z" 
          fill="url(#gnome_left_wing)"/>

    <!-- Primary Right-To-Left Diagonal Beam -->
    <path d="M 358 116 
             C 348 104 330 100 316 108
             L 120 396
             C 110 408 114 424 128 432
             L 160 446
             C 174 454 192 448 202 436
             L 400 152
             C 410 140 406 124 392 116 Z" 
          fill="url(#gnome_right_wing)"/>

    <!-- Top Wing Specular Highlights -->
    <path d="M 154 116 L 196 108 L 256 186 L 240 206 Z" fill="url(#gnome_rim)"/>
    <path d="M 358 116 L 316 108 L 256 186 L 272 206 Z" fill="url(#gnome_rim)"/>

    <!-- The Delta Apex Cap (Unifying the top into an authentic Greek Delta) -->
    <path d="M 256 68 
             L 304 136 
             L 256 180 
             L 208 136 Z" 
          fill="#62a0ea"/>
    <path d="M 256 68 L 304 136 L 256 148 Z" fill="#99c1f1"/>

    <!-- Horizontal Delta Base Beam (Grounded Foundation) -->
    <path d="M 144 354
             L 368 354
             C 382 354 394 366 394 380
             L 394 388
             C 394 402 382 414 368 414
             L 144 414
             C 130 414 118 402 118 388
             L 118 380
             C 118 366 130 354 144 354 Z" 
          fill="url(#gnome_base_beam)"/>
    <rect x="144" y="354" width="224" height="3" rx="1.5" fill="url(#gnome_rim)"/>

    <!-- Central Recessed Delta Aperture -->
    <polygon points="256,208 214,284 298,284" 
             fill="#181d29"/>

    <!-- The Rust High-Velocity Energy Core -->
    <polygon points="256,220 226,274 286,274" 
             fill="url(#gnome_rust_core)"/>
    <polygon points="256,220 286,274 256,274" 
             fill="#ff7800"/>
  </g>
</svg>