name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libssl-dev \
            pkg-config \
            cmake \
            meson \
            ninja-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  build:
    name: Build & Package
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libssl-dev \
            pkg-config \
            cmake \
            meson \
            ninja-build \
            rpm \
            zstd \
            tar \
            ruby \
            ruby-dev \
            build-essential \
            unzip \
            curl

      - name: Install fpm for RPM and DEB packaging
        run: |
          sudo gem install --no-document fpm

      - name: Setup appimagetool (FUSE-free extraction)
        run: |
          curl -sLo /tmp/appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract)
          sudo mv /tmp/squashfs-root /usr/local/lib/appimagetool
          sudo ln -s /usr/local/lib/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Package for Debian, Arch, Fedora, AppImage and Tarball
        run: |
          ./packaging/package.sh
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "Generated packages:"
          ls -lh

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xdelta-packages
          path: dist/*
          retention-days: 7

